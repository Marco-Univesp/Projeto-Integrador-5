<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Devolução</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- Se quiser usar Bootstrap, basta incluir -->
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body>

<header id="header">
  <img src="{{ url_for('static', filename='imagens/logoPI.png') }}" alt="Logo" class="logo">
  <nav id="nav">
    <button aria-label="Abrir Menu" id="btn-mobile">
      Menu <span id="hamburger"></span>
    </button>
    <ul id="menu" role="menu">
      <li>
        <a href="{{ url_for('home') }}" class="logout-btn">
          <span>Sair</span>
        </a>
      </li>
    </ul>
  </nav>
</header>

<div class="container7">
  <h1>Devolução de Produto</h1>

  <div class="return-section">
    <!-- FORMULÁRIO -->
    <form id="formDevolucao" action="{{ url_for('registro_devolucao') }}" method="POST" enctype="multipart/form-data">
      <label for="pedido">Número do Pedido:</label>
      <input type="text" id="pedido" name="pedido" required>

      <label for="nome">Nome do Produto:</label>
      <input type="text" id="nome" name="nome" required>

      <label for="motivo">Motivo da Devolução:</label>
      <textarea id="motivo" name="motivo" required></textarea>

      <label for="imagem">Imagens do Produto:</label>
      <input type="file" id="imagem" name="imagem" multiple required>

      <label for="preco">Preço:</label>
      <input type="number" step="0.01" id="preco" name="preco">

      <label for="quantidade">Quantidade:</label>
      <input type="number" id="quantidade" name="quantidade" required>

      <!-- ⚠️ Campo ID do Cliente removido -->

      <label for="ponto">Ponto de Coleta:</label>
      <select id="ponto" name="ponto" class="form-select" required>
        <option value="" disabled selected>Selecione um ponto de coleta</option>
        <option value="Centro">📍 Centro</option>
        <option value="Zona Norte">📍 Zona Norte</option>
        <option value="Zona Sul">📍 Zona Sul</option>
      </select>

      <button type="submit">Registrar Devolução
