<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_admin.css') }}">
  <style>
    .navbar {
      background-color: #1d3557; /* azul escuro */
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
    }
    .navbar .logo img {
      height: 50px;
    }
    .navbar nav a {
      color: #fff;
      margin-left: 20px;
      text-decoration: none;
      font-weight: bold;
    }
    .navbar nav a:hover {
      color: #a8dadc;
    }
  </style>
</head>
<body>
<header class="navbar">
  <div class="logo">
    <img src="{{ url_for('static', filename='imagens/logoPI.png') }}" alt="Logo Reloop">
  </div>
  <nav>
    <a href="{{ url_for('painel_admin') }}" class="{% if request.endpoint == 'painel_admin' %}ativo-admin{% endif %}">📑 Painel Admin</a>
    <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}ativo-dashboard{% endif %}">📊 Dashboard</a>
    <a href="{{ url_for('estoque_fisico') }}">📦 Estoque</a>
    <a href="{{ url_for('descarte') }}">🗑️ Descarte</a>
  </nav>
</header>



  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
