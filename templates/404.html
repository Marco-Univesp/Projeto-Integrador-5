<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Página não encontrada</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style_admin.css') }}">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f2f4f8;
      color: #333;
      text-align: center;
      padding: 50px;
    }

    .logo {
      width: 140px;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 72px;
      margin-bottom: 10px;
      color: #e63946;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 20px;
      color: #1d3557;
    }

    p {
      font-size: 16px;
      color: #666;
    }

    .btn {
      display: inline-block;
      margin: 15px;
      text-decoration: none;
      color: #fff;
      background-color: #32bcae;
      padding: 12px 24px;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #27988c;
    }
  </style>
</head>
<body>
  <img src="{{ url_for('static', filename='img/reloop_logo.png') }}" alt="Logo Reloop" class="logo">
  <h1>404</h1>
  <h2>Oops! Página não encontrada</h2>
  <p>A página que você tentou acessar não existe ou foi movida.</p>
  <a href="{{ url_for('home') }}" class="btn">🏠 Voltar para Home</a>
  <a href="{{ url_for('painel_admin') }}" class="btn">📊 Ir para o Painel</a>
</body>
</html>
